# SCOUT local development stack.
# Production database is Supabase PostgreSQL (pgvector); the local `db` service
# mirrors that for development parity. RabbitMQ state is persistent via volumes.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: scout-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: scout
      RABBITMQ_DEFAULT_PASS: scout
      RABBITMQ_DEFAULT_VHOST: /scout
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      SCOUT_DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SCOUT_DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
      SCOUT_RABBITMQ_URL: amqp://scout:scout@rabbitmq:5672/%2Fscout
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "workers.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment:
      SCOUT_DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
      SCOUT_RABBITMQ_URL: amqp://scout:scout@rabbitmq:5672/%2Fscout
    volumes:
      - hf_cache:/opt/hf_cache
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "workers.celery_app:app", "beat", "--loglevel=INFO"]
    env_file: .env
    environment:
      SCOUT_DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
      SCOUT_RABBITMQ_URL: amqp://scout:scout@rabbitmq:5672/%2Fscout
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmq_data:
  hf_cache:
