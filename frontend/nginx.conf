server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all unknown routes serve index.html (client-side router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container (production compose network)
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # SSE streaming: disable buffering for the chat endpoint
    location /v1/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }
}
