[project]
name = "scout-backend"
version = "0.2.0"
description = "SCOUT - AI-powered document intelligence platform (FastAPI backend)"
requires-python = ">=3.11"
# 100% free & open-source, deliberately LIGHT: no torch/transformers, no
# RabbitMQ/Celery, no pgvector. Document AI runs on the free Gemini API tier.
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy>=2.0.35,<2.1",
    "google-genai>=1.0.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "structlog>=24.4.0,<26.0",
    "pyjwt[crypto]>=2.9.0,<3.0",
    "python-multipart>=0.0.12",
    "numpy>=1.26.0,<3.0",
    "psycopg2-binary>=2.9.9,<3.0",
]

[project.optional-dependencies]
# Light document parsers (all pure-Python or small C extensions).
ingestion = [
    "pymupdf>=1.24.10,<2.0",
    "python-docx>=1.1.2,<2.0",
    "python-pptx>=1.0.2,<2.0",
    "reportlab>=4.2.0,<5.0",
    "openpyxl>=3.1.0,<4.0",
    "charset-normalizer>=3.3.2,<4.0",
    "markdown-it-py>=3.0.0,<4.0",
]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
