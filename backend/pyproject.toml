[project]
name = "scout-backend"
version = "0.1.0"
description = "SCOUT - AI-powered document intelligence platform (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2.3,<4.0",
    "pgvector>=0.3.5,<0.4",
    "alembic>=1.13.0,<2.0",
    "celery[amqp]>=5.4.0,<6.0",
    "pika>=1.3.2,<2.0",
    "httpx>=0.27.0,<1.0",
    "structlog>=24.4.0,<25.0",
    "pyjwt[crypto]>=2.9.0,<3.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Heavy document-understanding stack. Installed in API/worker images.
ingestion = [
    "docling>=2.2.0,<3.0",
    "pymupdf>=1.24.10,<2.0",
    "python-docx>=1.1.2,<2.0",
    "python-pptx>=1.0.2,<2.0",
    "reportlab>=4.2.0,<5.0",
    "fastexcel>=0.11.5,<1.0",
    "polars>=1.9.0,<2.0",
    "openpyxl>=3.5.0,<4.0",
    "duckdb>=1.1.0,<2.0",
    "camelot-py>=0.11.0,<1.0",
    "charset-normalizer>=3.3.2,<4.0",
    "markdown-it-py>=3.0.0,<4.0",
]
# OCR for scanned/image-only pages. Requires OpenCV system libs; see Dockerfile.
ocr = [
    "paddleocr>=2.8.0,<3.0",
    "paddlepaddle>=2.6.0,<3.0",
]
ai = [
    "google-genai>=1.0.0,<2.0",
    "transformers>=4.45.0,<5.0",
    "torch>=2.4.0,<3.0",
]
supabase = [
    "supabase>=2.9.0,<3.0",
]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
