# SCOUT RabbitMQ broker configuration.
# Messages are published persistent (delivery_mode=2) by the backend, queues are
# durable and declared by the Celery application; broker state lives on the volume.
loopback_users.guest = false
# Default user/vhost come from environment (see docker-compose.yml).

disk_free_limit.absolute = 1GB
vm_memory_high_watermark.relative = 0.6

# Durable classic queues keep messages when the broker restarts.
default_queue_type = classic
log.console.level = info
