# Render Blueprint for SCOUT — single native Python web service (no Docker).
# SQLite (zero-config, file on the service disk) + the free Gemini API tier;
# ingestion runs in-process via FastAPI BackgroundTasks. No Postgres,
# RabbitMQ, Celery, or separate worker. Frontend deploys separately on Vercel.
# NOTE: free plan disk is ephemeral — SQLite data resets on each deploy.
services:
  - type: web
    name: scout-api
    runtime: python
    plan: free
    rootDir: ./backend
    buildCommand: pip install -e ".[ingestion]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # No SCOUT_DATABASE_URL needed — SQLite is used by default.
      # Set it only if you point at an external database instead.
      - key: SCOUT_SUPABASE_URL
        value: "https://ftdmbprinolyglvfbevl.supabase.co"
      - key: SCOUT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SCOUT_SUPABASE_JWKS_URL
        sync: false
      - key: SCOUT_GEMINI_API_KEY
        sync: false
      - key: SCOUT_CORS_ALLOW_ORIGINS  # your Vercel URL, e.g. https://scout.vercel.app
        sync: false
