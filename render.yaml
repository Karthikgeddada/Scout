# Render Blueprint for SCOUT — single all-in-one backend service.
# Deploys backend/ as one Docker web service that runs PostgreSQL (+pgvector),
# RabbitMQ (both in-container), Alembic migrations, Celery worker + embedded
# beat, and the FastAPI API. No external database required.
# Frontend deploys separately on Vercel.
services:
  - type: web
    name: scout-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin PORT so uvicorn, the Docker HEALTHCHECK (localhost:8000) and
      # Render all agree on one port.
      - key: PORT
        value: "8000"
      # No SCOUT_DATABASE_URL needed — the in-container Postgres is used by
      # default. Set it only if you point at an external Postgres instead.
      - key: SCOUT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SCOUT_SUPABASE_JWKS_URL
        sync: false
      - key: SCOUT_GEMINI_API_KEY
        sync: false
      - key: SCOUT_CORS_ALLOW_ORIGINS  # your Vercel URL, e.g. https://scout.vercel.app
        sync: false
